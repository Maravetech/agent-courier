name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Unit tests (offline, fake CODEX_HOME)
        run: python -m unittest discover -s tests -v
      - name: Build native overlay
        if: runner.os == 'macOS'
        run: sh overlay/build.sh
      - name: Check manifests are valid JSON
        run: python -c "import json;[json.load(open(p)) for p in ('.claude-plugin/plugin.json','.claude-plugin/marketplace.json')]"
  test:
    name: test
    needs: tests
    if: always()
    runs-on: ubuntu-latest
    steps:
      - if: needs.tests.result != 'success'
        run: exit 1
